packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 10 blocks lifecycle scripts by default. These need theirs to place
# platform binaries; everything else stays blocked.
onlyBuiltDependencies:
  - esbuild
  - '@tailwindcss/oxide'
  - mongodb-memory-server

# concurrently pins shell-quote to exactly 1.9.0, which is affected by
# GHSA-pqg4-j6r4-53mv, and no concurrently release carries a patched pin yet.
# Drop this once concurrently depends on shell-quote >= 1.11.0.
overrides:
  shell-quote: 1.11.0
